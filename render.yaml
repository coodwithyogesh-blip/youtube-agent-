services:
  - type: web
    name: youtube-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 240
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTO_REPLY_MODE
        value: automatic
      - key: COMMENT_POLL_SECONDS
        value: "900"
