services:
  - type: web
    name: youtube-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTO_REPLY_MODE
        value: automatic
      - key: COMMENT_POLL_SECONDS
        value: "900"
